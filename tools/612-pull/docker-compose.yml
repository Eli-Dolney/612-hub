name: grokpull
services:
  api:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GROKPULL_PORT:-8788}:8788"
    environment:
      GROKPULL_PASSWORD: ${GROKPULL_PASSWORD:?Set GROKPULL_PASSWORD in your local environment}
      GROKPULL_CORS: ${GROKPULL_CORS:-}
      GROKPULL_GUEST_ONLY: "1"
      GROKPULL_CONFIG_DIR: /data
      YTDLP_POT_BASE_URL: http://pot:4416
    volumes:
      - downloads:/app/downloads
      - music:/app/music
      - guest-tmp:/app/guest-tmp
      - config:/data
    depends_on:
      pot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8788/api/guest/status',timeout=5)); assert s['ready'] and s['youtube']"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [share]
    command: tunnel --no-autoupdate --url http://api:8788
    depends_on:
      api:
        condition: service_healthy
volumes:
  downloads:
  music:
  guest-tmp:
  config:
